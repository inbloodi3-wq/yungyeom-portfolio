# Project Definition — Personal Portfolio / Profile Website
# 이 파일이 프로젝트의 목표·대상·제약에 대한 Source of Truth다. Schema는 config/project-template.yaml.
# 비어 있는 값은 아직 사용자가 정하지 않은 것이다. Agent가 추정해 채우지 않는다(Level 3).

project:
  id: personal-portfolio
  mode: figma_implementation   # figma_implementation | autonomous_generation (2026-10-04 사용자 지정)
  name: ""                 # 사이트 이름/표기할 이름 — Design Source에서 확인하거나 사용자 제공
  type: "personal portfolio / profile website"
  description: ""          # 한두 문장(meta description 등에 필요) — 사용자 제공

# Design Source — 디자인 정의가 어디서 오는가
design_source:
  type: figma              # figma | generated
  access: read_only        # figma는 항상 read_only. Figma를 수정하지 않는다
  status: PLAN_READY       # NOT_CONFIRMED | CONFIRMED | CALIBRATED | PLAN_READY — Project Page는 2026-10-12 공통 구성으로 결정(implementation-spec.md 26절)
  reference:
    url: "https://www.figma.com/design/4IjbcMoAkTyWkoacnVAmNe/?node-id=1716-2382"   # 2026-10-04 사용자 제공
    file_key: "4IjbcMoAkTyWkoacnVAmNe"
    page: "자동화"            # Primary implementation Page (1716:2382)
    root: "포트폴리오"        # Primary implementation Root (Section 2025:7129). Node 대응은 frame_map 참조
  local_exports: ""        # 선택. Figma 도구를 쓸 수 없을 때 사용자가 내보낸 PNG/PDF 폴더
  # Design Definition 산출물(read-design-source가 생성). docs/는 SITE SCAFFOLD에서 처음 만든다
  frame_map: design-source/frame-map.md              # Website Page/Section ↔ Figma Page/Frame/Node ID
  token_source: design-source/extracted-tokens.json  # scaffold-site가 읽어 docs/css/tokens.css를 생성
  spec: design-source/implementation-spec.md

# 아래 4개는 figma_implementation에서는 선택 사항이다(디자인이 이미 답을 담고 있다).
# autonomous_generation에서는 필수다.
goals: []

audiences: []
  # - id: ""
  #   name: ""
  #   description: ""
  #   core_tasks: []

primary_user_tasks: []

ux_requirements: []
design_constraints: []
project_asset_restrictions: []
reference_preferences: []

# ---------------- Site (2026-10-04 사용자 승인 — 변경은 Level 3) ----------------
site:
  stack: ["HTML5", "CSS3", "Vanilla JavaScript"]
  forbidden: ["React", "Vue", "Next.js", "TypeScript", "Tailwind", "build tools", "package managers", "JS/CSS frameworks"]
  source_dir: docs
  repository: "inbloodi3-wq/2026-UIUX"
  deploy:
    platform: github-pages
    method: branch          # GitHub Actions 사용 안 함
    branch: main
    folder: /docs
  base_path: "/2026-UIUX/"
  url: "https://inbloodi3-wq.github.io/2026-UIUX/"
  pages:
    - { id: index, file: index.html }
    - { id: aidora, file: aidora.html }             # Project Page 3개는 css/pages/project.css를 함께 쓴다(2026-10-12)
    - { id: tj-media, file: tj-media.html }
    - { id: asics-korea, file: asics-korea.html }
  breakpoints: [600, 1024, 1440] # min-width(px). CSS Media Query 값의 유일한 원본. 600 미만 = Mobile, 600 이상 = Tablet, 1024 이상 = Cover의 Figma 구성(비례 축소), 1440 이상 = Profile의 Figma 구성(비례 축소)
  js_policy:
    progressive_enhancement: true   # JS 없이 핵심 콘텐츠·내비게이션 사용 가능
    files: ["js/main.js"]
    review_threshold_lines: 150     # 넘으면 review-code에서 이유를 확인한다(금지선이 아니다)
  performance_budget:               # 초기 기준. Page당, 로컬 측정(capture.cjs) 기준
    max_transfer_kb: 1500
    max_requests: 30

viewports:                 # Browser QA 기준 폭(px). 세 Viewport 모두 필수. figma mode에서는 intake 때 Figma Frame 폭에 맞춘다
  desktop: 1920            # Figma Frame 폭. 2026-10-04 intake에서 맞춤
  laptop: 1440             # 좁은 Desktop. Figma에 디자인 없음 — 1920 구성을 비례 축소(2026-10-04 사용자 지정)
  tablet: 768              # Figma에 디자인 없음 — Conservative Adaptation(2026-10-04 사용자 지정)
  mobile: 390              # Figma에 디자인 없음 — Conservative Adaptation(2026-10-04 사용자 지정)

automation:
  autonomy_mode: autonomous     # guided | autonomous
  user_approval_budget: 3
  max_polish_passes: 3
  state_file: automation/pipeline-state.json

# visual_expression / visual_direction은 autonomous_generation 전용이다. figma_implementation에서는 사용하지 않는다.
visual_expression:              # auto | low | medium | high (style_bias: auto | restrained | balanced | expressive)
  style_bias: auto
  color_intensity: auto
  typography_expressiveness: auto
  composition_experimentation: auto
  imagery_dominance: auto
  artwork_intensity: auto
  motion_intensity: auto

visual_direction:
  status: NOT_STARTED           # NOT_STARTED | PROPOSED | APPROVED (APPROVED 이후 변경은 Level 3)
  name: ""

status: in_progress
